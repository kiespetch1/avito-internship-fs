services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assistants}
      POSTGRES_USER: ${POSTGRES_USER:-assistants}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assistants}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    stop_grace_period: 30s
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: ${DATABASE_URL:-postgres://assistants:assistants@postgres:5432/assistants?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      JWT_TTL: ${JWT_TTL:-24h}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120s}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/_info"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
